.btn svg{width:44%;height:44%;fill:#fff;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.45))}
.btn span{opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.btn.down{transform:scale(.9);filter:brightness(1.45)}
.btn.off{filter:grayscale(.85) brightness(.7)}
#bA{--c1:rgba(255,120,90,.75);--c2:rgba(200,40,50,.35);right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:80px;height:80px}

function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
const fontOf=size=>`700 ${size*1.55}px Fredoka, 'Trebuchet MS', sans-serif`;
function txt(s,x,y,c='#fff6d8',size=8,align='left'){ctx.font=fontOf(size);ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='rgba(10,5,25,.55)';ctx.fillText(s,x+.5,y+.7);ctx.fillStyle=c;ctx.fillText(s,x,y);}
function wrap(s,maxW,size){ctx.font=fontOf(size);const words=s.split(' '),lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(ctx.measureText(t).width>maxW&&l){lines.push(l);l=w;}else l=t;}if(l)lines.push(l);return lines;}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,7);ctx.fill();}
function line(x1,y1,x2,y2,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function glow(x,y,r,col,a=.6){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function puff(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,9*s,0,7);ctx.arc(x+10*s,y-5*s,11*s,0,7);ctx.arc(x+22*s,y,9*s,0,7);ctx.arc(x+11*s,y+3*s,10*s,0,7);ctx.fill();}

  case'fall':return{lean:0,bob:0,lF:[.35,.15],lB:[-.35,-.1],aF:[1.9,2.4],aB:[-1.9,-2.4]};

 if(t.inv>0||t.shield>0||t.armor>0||t.dash>0||t.down>0||t.spin>0)return false;

 const targets=team==='hero'?foes.concat(boss&&!boss.dead?[boss]:[]):heroesTeam();
 for(const t of targets){if(t.gone||set.has(t))continue;if(overlap(box,hitboxOf(t))){set.add(t);const hb=hitboxOf(t);if(damage(t,dmg,dir||sgn(hb.x+hb.w/2-(box.x+box.w/2))||1,kb,up))any=true;}}

function breakTiles(box){const c0=Math.floor(box.x/T),c1=Math.floor((box.x+box.w)/T),r0=Math.floor(box.y/T),r1=Math.floor((box.y+box.h)/T);

function collideX(o){o.hitWall=0;const r0=Math.floor(o.y/T),r1=Math.floor((o.y+o.h-1)/T);
 if(o.vx>0){const c=Math.floor((o.x+o.w)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){o.x=c*T-o.w-.01;o.vx=0;o.hitWall=1;return;}}
 else if(o.vx<0){const c=Math.floor(o.x/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){o.x=(c+1)*T+.01;o.vx=0;o.hitWall=-1;return;}}}
function collideY(o,wasBottom,isP){const c0=Math.floor((o.x+1)/T),c1=Math.floor((o.x+o.w-1)/T);
 if(o.vy>0){const r=Math.floor((o.y+o.h)/T);for(let c=c0;c<=c1;c++){const t=tileAt(c,r);if(SOLID.includes(t)||(t==='-'&&wasBottom<=r*T+1)){o.y=r*T-o.h;o.vy=0;o.ground=true;return;}}}
 else if(o.vy<0){const r=Math.floor(o.y/T);for(let c=c0;c<=c1;c++)if(solid(c,r)){o.y=(r+1)*T;o.vy=0;if(isP){const cc=Math.floor((o.x+o.w/2)/T);bump(solid(cc,r)?cc:c,r,o);}return;}}}

function allyInput(a){const inp={dir:0,jumpP:false,jumpH:a.vy<0,atkP:false,s1P:false,s2P:false};
 const t=nearestFoe(a);
 if(!t){const dx=player.x+a.off-a.x;if(Math.abs(dx)>20)inp.dir=sgn(dx);return inp;}
 const hb=hitboxOf(t),tx=hb.x+hb.w/2+a.off*.25,dx=tx-(a.x+5),dy=(hb.y+hb.h/2)-(a.y+13);
 if(Math.abs(dx)>16)inp.dir=sgn(dx);else a.face=sgn(dx)||a.face;
 if(a.ground&&(a.hitWall||(dy<-30&&rnd()<.04)))inp.jumpP=true;
 if(--a.atkCd<=0&&Math.abs(dx)<26&&Math.abs(dy)<36){inp.atkP=true;a.atkCd=8+rnd()*14;}
 if(!a.ground&&dy<-10&&Math.abs(dx)<30&&rnd()<.1)inp.atkP=true;
 if(--a.skCd<=0&&Math.abs(dx)<190){if(rnd()<.5)inp.s1P=true;else inp.s2P=true;a.skCd=260+rnd()*220;}
 return inp;}

/* ===================== FOES ===================== */
function stepFoe(e){
 if(e.gone)return;e.anim++;if(e.flash>0)e.flash--;
 if(e.fly){if(e.hurtT>0){e.hurtT--;e.x+=e.vx;e.vx*=.9;}else{e.ph+=.02;e.x=e.bx+Math.sin(e.ph)*48;e.y=e.by+Math.sin(e.ph*2.5)*12;}contact(e);return;}
 e.vy+=.4;
 if(e.hurtT>0){e.hurtT--;e.vx*=.9;moveBody(e,false);if(e.y>H+20)e.gone=true;return;}
 const tgt=nearestHero(e.x,e.y),dx=tgt.x-e.x,dy=tgt.y-e.y;
 if(e.blob){if(e.k==='j'&&e.ground&&--e.jt<=0){e.vy=-6;e.jt=80+rnd()*40;}
  if(Math.abs(e.vx)<.2)e.vx=e.face*.6*level.L.sp;
  moveBody(e,false);if(e.hitWall)e.vx=-e.hitWall*.6*level.L.sp;
  if(e.ground){const fc=Math.floor((e.vx>0?e.x+e.w+1:e.x-1)/T),fr=Math.floor((e.y+e.h+2)/T);if(!solid(fc,fr)&&tileAt(fc,fr)!=='-')e.vx=-e.vx;}
  e.face=sgn(e.vx)||e.face;contact(e);}
 else{
  if(e.cool>0)e.cool--;
  if(e.atk){const A=ATK[e.atk];e.atkT++;e.vx*=.8;
   if(e.atk==='mp'&&e.atkT>=A.act[0]&&e.atkT<=A.act[1])strike('foe',{x:e.face>0?e.x+e.w:e.x-14,y:e.y+5,w:14,h:12},A.dmg,A.kb,A.up,e.set,e.face);
   if(e.atk==='throw'&&e.atkT===16){const v=clamp(dx/55,-3.5,3.5);projs.push(P({kind:'dark',x:e.x+5,y:e.y+4,vx:v,vy:-3.6,grav:.15,r:4,dmg:8,life:200,team:'foe'}));}
   if(e.atkT>=A.dur)e.atk=null;}
  else{const near=Math.abs(dx)<230&&Math.abs(dy)<70;
   if(near){e.face=sgn(dx)||e.face;
    if(e.k==='m'){if(Math.abs(dx)>14)e.vx=e.face*.95*level.L.sp;else e.vx=0;if(e.cool<=0&&Math.abs(dx)<24&&Math.abs(dy)<22){e.atk='mp';e.atkT=0;e.set=new Set();e.cool=70;}}
    else{const want=Math.abs(dx)<90?-e.face:Math.abs(dx)>170?e.face:0;e.vx=want*.7;if(e.cool<=0){e.atk='throw';e.atkT=0;e.cool=110;}}}
   else{if(Math.abs(e.vx)<.1)e.vx=e.face*.4;}
   if(e.ground&&e.vx){const fc=Math.floor((e.vx>0?e.x+e.w+1:e.x-1)/T),fr=Math.floor((e.y+e.h+2)/T);if(!solid(fc,fr)&&tileAt(fc,fr)!=='-'){e.vx=0;if(!near)e.face=-e.face;}}}
  moveBody(e,false);if(e.hitWall&&!e.atk)e.face=-e.hitWall;}
 if(e.y>H+20)e.gone=true;}
function contact(e){for(const h of heroesTeam()){if(h.down>0)continue;if(overlap(h,e)){
  const stomp=h.vy>0&&(h.y+h.h-e.y)<10;
  if(stomp){damage(e,20,h.face,1,2);h.vy=K.jump&&h===player?-8:-5.5;h.dbl=false;}
  else if(h.dash>0||h.armor>0||h.shield>0||h.spin>0)damage(e,20,sgn(e.x-h.x)||1,3,3);
  else damage(h,8,sgn(h.x-e.x)||1,3,3);}}}
function stompFighters(){const p=player;if(p.vy<=0)return;for(const e of foes){if(e.gone||e.blob||e.fly)continue;if(overlap(p,e)&&(p.y+p.h-e.y)<10){damage(e,20,p.face,1,3);p.vy=K.jump?-8:-5.5;p.dbl=false;}}}

/* ===================== BOSSES ===================== */
function spawnBoss(kind){const l=lock.l;
 if(kind==='giant')boss={boss:1,kind,team:'foe',x:l+W-90,y:60,w:24,h:58,vx:0,vy:0,face:-1,hp:280,max:280,st:'walk',stT:0,cool:60,t:0,set:new Set(),anim:0,name:'GIANT OF FEAR'};
 if(kind==='serpent')boss={boss:1,kind,team:'foe',hx:l+W-60,hy:120,trail:[],hp:320,max:320,st:'weave',stT:0,t:0,face:-1,name:'SERPENT OF LIES',hb(){return{x:this.hx-11,y:this.hy-8,w:22,h:16};}};
 if(kind==='satan')boss={boss:1,kind,team:'foe',x:l+W-90,y:30,w:36,h:62,hp:1700,max:1700,st:'float',stT:0,t:0,face:-1,name:'SATAN',vol:0};
 boss.dead=false;SFX.boom();shake=10;}
function bossDown(b){b.dead=true;b.dt=0;SFX.gate();projs=projs.filter(p=>p.team!=='foe');pillars=[];for(const e of foes)if(!e.gone)defeat(e);}
function updateBoss(){const b=boss;b.t++;if(b.flash>0)b.flash--;
 if(b.dead){b.dt++;const hb=hitboxOf(b);if(b.dt%5===0)burst(hb.x+rnd()*hb.w,hb.y+rnd()*hb.h,'#fff3a0',6,2.5);
  if(b.dt===140){if(b.kind==='satan')ending();else finishLevel();}return;}
 const tgt=nearestHero(b.x||b.hx,b.y||b.hy),rage=b.hp<b.max/2,l=lock.l,r=lock.r;
 if(b.kind==='giant'){b.vy+=.45;const dx=tgt.x-(b.x+b.w/2);
  if(b.st==='walk'){b.face=sgn(dx)||b.face;b.vx=b.face*(rage?1:.65);if(b.cool>0)b.cool--;
   if(Math.abs(dx)<44&&b.cool<=0){b.st='wind';b.stT=0;b.vx=0;}
   else if(b.t%(rage?200:260)===0&&b.ground){b.st='jump';b.stT=0;b.vy=-8.5;b.vx=clamp(dx/40,-3,3);}
   else if(rage&&b.t%420===0&&foes.filter(e=>!e.gone).length<3){foes.push(makeFoe('m',l+20,40),makeFoe('m',r-30,40));}}
  else if(b.st==='wind'){b.vx=0;if(++b.stT>=(rage?26:38)){b.st='smash';b.stT=0;b.set=new Set();SFX.boom();shake=8;}}
  else if(b.st==='smash'){b.vx=0;if(b.stT<6)strike('foe',{x:b.face>0?b.x+b.w-4:b.x-40,y:b.y+8,w:44,h:50},16,6,4,b.set,b.face);if(++b.stT>30){b.st='walk';b.cool=50;}}
  else if(b.st==='jump'){b.stT++;if(b.ground&&b.stT>5){waves.push({x:b.x+b.w/2,y:b.y+b.h,r:6,max:130,dmg:12,kb:4,up:5,team:'foe',set:new Set(),kind:'ground'});SFX.boom();shake=10;b.st='walk';b.vx=0;}}
  moveBody(b,false);
  for(const h of heroesTeam())if(h.down<=0&&overlap(h,b)){if(h.vy>0&&h.y+h.h-b.y<12){damage(b,14,1,0,0);h.vy=-7;h.dbl=false;}else damage(h,10,sgn(h.x-b.x)||1,4,3);}}
 if(b.kind==='serpent'){let tx,ty;
  if(b.st==='weave'){tx=l+W/2+Math.sin(b.t*.012)*(W/2-50);ty=125+Math.sin(b.t*.031)*55;
   if(b.t%(rage?95:140)===0){for(let i=-1;i<=1;i++){const a=Math.atan2(tgt.y+10-b.hy,tgt.x-b.hx)+i*.25;projs.push(P({kind:'venom',x:b.hx,y:b.hy,vx:Math.cos(a)*2.6,vy:Math.sin(a)*2.6,grav:.03,r:3,dmg:8,life:200,team:'foe',ghost:1}));}}
   if(++b.stT>(rage?240:320)){b.st='lunge';b.stT=0;b.lx=tgt.x+5;b.ly=Math.min(176,tgt.y+12);}}
  if(b.st==='lunge'){tx=b.lx;ty=b.ly;if(++b.stT>45){b.st='rest';b.stT=0;}}
  if(b.st==='rest'){tx=b.lx;ty=176;if(++b.stT>(rage?70:110)){b.st='weave';b.stT=0;}}
  const k=b.st==='lunge'?.12:.05;const ox=b.hx;b.hx+=(tx-b.hx)*k;b.hy+=(ty-b.hy)*k;b.face=sgn(b.hx-ox)||b.face;
  b.trail.unshift({x:b.hx,y:b.hy});if(b.trail.length>80)b.trail.pop();
  for(const h of heroesTeam()){if(h.down>0)continue;
   if(overlap(h,b.hb())){if(h.vy>0&&h.y+h.h-b.hy<6){damage(b,12,1,0,0);h.vy=-7;h.dbl=false;}else damage(h,10,sgn(h.x-b.hx)||1,4,3);continue;}
   for(let i=8;i<b.trail.length;i+=8){const s=b.trail[i];if(overlap(h,{x:s.x-6,y:s.y-6,w:12,h:12})){damage(h,8,sgn(h.x-s.x)||1,3,3);break;}}}}
 if(b.kind==='satan'){let tx=b.x,ty=b.y;b.stT++;
  if(b.st==='float'){tx=l+W/2-18+Math.sin(b.t*.011)*(W/2-70);ty=26+Math.sin(b.t*.04)*10;
   if(b.t%(rage?65:95)===0){const n=rage?7:5;for(let i=0;i<n;i++){const a=Math.atan2(tgt.y+12-(b.y+30),tgt.x+5-(b.x+18))+(i-(n-1)/2)*.22;projs.push(P({kind:'fire',x:b.x+18,y:b.y+30,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,r:4,dmg:10,life:220,team:'foe',ghost:1}));}tone(200,.2,'sawtooth',.04,-100);}
   if(b.stT>(rage?260:340)){b.stT=0;const opts=['pillars','swoop'];if(foes.filter(e=>!e.gone).length<3)opts.push('summon');b.st=opts[Math.floor(rnd()*opts.length)];
    if(b.st==='swoop'){b.side=tgt.x<l+W/2?1:-1;b.sx=b.side>0?r-60:l+24;}
    if(b.st==='pillars'){for(const h of heroesTeam().slice(0,5))pillars.push({x:h.x+5,t:0,set:new Set()});pillars.push({x:l+40+rnd()*(W-80),t:0,set:new Set()});}
    if(b.st==='summon'){foes.push(makeFoe('m',l+20,30),makeFoe('m',r-30,30));if(rage)foes.push(makeFoe('t',l+W/2,30));showToast('Satan calls his shadows!',90);}}}
  else if(b.st==='pillars'||b.st==='summon'){ty=20;if(b.stT>110){b.st='float';b.stT=0;}}
  else if(b.st==='swoop'){if(b.stT<50){tx=b.sx;ty=192-62;}else{tx=b.x-b.side*(rage?6:4.5);ty=192-62;if(b.x<l+10||b.x>r-46){b.st='rest';b.stT=0;}}}
  else if(b.st==='rest'){ty=192-62;if(b.stT>(rage?80:120)){b.st='float';b.stT=0;}}
  if(b.st==='swoop'&&b.stT>=50)b.x=tx;else b.x+=(tx-b.x)*.06;b.y+=(ty-b.y)*.06;b.face=sgn(tgt.x-b.x)||b.face;
  for(const h of heroesTeam()){if(h.down>0)continue;if(overlap(h,b)){if(h.vy>0&&h.y+h.h-b.y<12){damage(b,14,1,0,0);h.vy=-7.5;h.dbl=false;}else damage(h,14,sgn(h.x-b.x-18)||1,5,4);}}}}
function spawnAllies(){allies=HEROES.filter(h=>h!==hero).concat([BELINDA]).map((h,i)=>{const a=makeFighter(h,lock.l+8+i*9,20+i*4,true);a.face=1;return a;});}
const BOSS_ALLY_LINES=()=>HEROES.filter(h=>h!==hero).map(h=>[h.id,h.line]).concat([['belinda',BELINDA.line]]);

/* ===================== WORLD UPDATE ===================== */
function update(){
 frame++;if(flashT>0)flashT--;if(hitstop>0){hitstop--;return;}
 if(superFx){superFx.t--;if(superFx.t===26)superBlast(superFx.f);if(superFx.t<=0)superFx=null;else if(superFx.t>26)return;}
 const p=player;stepFighter(p,playerInput());stompFighters();
 for(const a of allies){stepFighter(a,allyInput(a));if(a.y>H+20){a.x=lock?lock.l+30:p.x;a.y=20;a.vy=0;}}
 for(const e of foes)stepFoe(e);
 if(boss)updateBoss();
 for(const it of items){if(it.gone)continue;
  if(it.k==='coin'){if(it.drop){it.age++;it.vy+=.3;it.x+=it.vx;it.vx*=.98;const r=Math.floor((it.y+it.h+it.vy)/T),c=Math.floor((it.x+5)/T);
    if(it.vy>0&&(solid(c,r)||tileAt(c,r)==='-')){it.y=r*T-it.h;it.vy=Math.abs(it.vy)>1.6?-it.vy*.45:0;it.vx*=.7;}else it.y+=it.vy;if(it.y>H+20)it.gone=true;}
   const mr=own('magnet')?110:28,dx=p.x+5-(it.x+5),dy=p.y+12-(it.y+5);if((!it.drop||it.age>18)&&Math.hypot(dx,dy)<mr){it.x+=dx*.2;it.y+=dy*.2;it.vx=it.vy=0;it.pull=1;}}
  if(!overlap(p,it))continue;
  if(it.k==='coin'){it.gone=true;stats.coins+=it.v;save.coins+=it.v;SFX.coin();parts.push({spark:1,gold:1,x:it.x+5,y:it.y+5,life:8,a:rnd()*3});continue;}
  if(it.k==='loaf'){it.gone=true;stats.loaves++;heal(p,3);p.mp=Math.min(100,p.mp+4);SFX.coin();}
  else if(it.k==='heart'){it.gone=true;heal(p,30);SFX.coin();}
  else if(it.k==='scroll'){it.gone=true;stats.scrolls++;p.mp=100;SFX.gate();showToast(VERSES[(levelI*2+stats.scrolls)%VERSES.length]);}
  else if(it.k==='check'&&!it.lit){it.lit=true;p.cx=it.x-2;p.cy=it.y-4;SFX.coin();showToast('Checkpoint: the candle is lit',90);}
  else if(it.k==='npc'&&!it.talked){it.talked=true;p.vx=0;const n=NPC_TALK[it.id];let lines=n.lines;
   if(it.id==='marie'&&(hero.id==='alisa'||hero.id==='sarah'))lines=[['marie','#NAME#! That\'s my girl! Mom is SO proud of you.']].concat(lines);
   if(n.heal){p.hp=p.max;p.mp=100;}say(lines,()=>{state='play';});}
  else if(it.k==='goal'){finishLevel();return;}}
 for(const q of projs){q.life--;
  if(q.home){const t=nearestFoe(q,260);if(t){const hb=hitboxOf(t);const a=Math.atan2(hb.y+hb.h/2-q.y,hb.x+hb.w/2-q.x);q.vx+=Math.cos(a)*.35;q.vy+=Math.sin(a)*.35;const sp=Math.hypot(q.vx,q.vy);if(sp>3.2){q.vx*=3.2/sp;q.vy*=3.2/sp;}}}
  if(q.grav)q.vy+=q.grav;q.x+=q.vx;q.y+=q.vy;
  if(q.kind==='band'){const o=q.owner;q.x=o.x+5+o.face*4;q.y=o.y+9;q.len=82*Math.sin(Math.PI*(1-q.life/q.max));const bx=o.face>0?q.x:q.x-q.len;strike(q.team,{x:bx,y:q.y-4,w:q.len,h:8},q.dmg,5,2,q.set,o.face);continue;}
  if(!q.ghost){const c=Math.floor(q.x/T),rb=Math.floor((q.y+q.r)/T);
   if(q.vy>0&&solid(c,rb)){q.y=rb*T-q.r;if(q.hop)q.vy=-q.hop;else if(q.bounce)q.vy=-q.bounce;else if(q.roll)q.vy=0;else{q.life=0;burst(q.x,q.y,'#fff3a0',4,1);}}
   const cw=Math.floor((q.x+sgn(q.vx)*q.r)/T),rm=Math.floor(q.y/T);
   if(solid(cw,rm)){const tt=tileAt(cw,rm);if(q.team==='hero'&&(tt==='?'||tt==='!'))openCrate(cw,rm);if(q.kind==='monkey')q.vx=-q.vx;else{q.life=0;burst(q.x,q.y,'#ddd',4,1);}}}
  const box=q.kind==='sword'?{x:q.x-6,y:q.y-12,w:12,h:24}:{x:q.x-q.r,y:q.y-q.r,w:q.r*2,h:q.r*2};
  if(strike(q.team,box,q.dmg,q.kind==='roller'?5:2.5,q.kind==='roller'?4:2,q.set,sgn(q.vx)||1)&&!q.pierce)q.life=0;
  if(q.kind==='monkey'&&q.life%25===0)q.set=new Set();
  if(rnd()<.4&&q.kind!=='kid'&&q.kind!=='monkey'&&q.kind!=='roller')parts.push({x:q.x,y:q.y,vx:0,vy:0,life:10,c:q.team==='foe'?'#b04ae0':q.kind==='laser'?'#3ef0ff':'#fff3a0',s:2,light:1});}
 projs=projs.filter(q=>q.life>0&&q.y<H+40&&q.x>cam-80&&q.x<cam+W+80);
 for(const w of waves){w.r+=w.kind==='field'?4:5;if(w.kind==='heal')continue;const tg=w.team==='hero'?foes.concat(boss&&!boss.dead?[boss]:[]):heroesTeam();
  for(const t of tg){if(t.gone||w.set.has(t))continue;const hb=hitboxOf(t);const dx=hb.x+hb.w/2-w.x,dy=hb.y+hb.h/2-w.y;
   if(Math.hypot(dx,dy)<w.r+hb.w/2&&(w.kind!=='ground'||Math.abs(dy)<34)){w.set.add(t);damage(t,w.dmg,sgn(dx)||1,w.kb,w.up);}}
  if(w.kind==='field'||w.kind==='praise')for(const q of projs)if(q.team!=='hero'&&Math.hypot(q.x-w.x,q.y-w.y)<w.r)q.life=0;}
 waves=waves.filter(w=>w.r<w.max);
 for(const pl of pillars){pl.t++;if(pl.t>50&&pl.t<72)strike('foe',{x:pl.x-9,y:0,w:18,h:192},14,3,6,pl.set,1);if(pl.t===51){SFX.boom();shake=4;}}
 pillars=pillars.filter(pl=>pl.t<80);
 for(const q of parts){q.life--;q.x+=q.vx||0;q.y+=q.vy||0;if(q.loafpop||q.wood)q.vy+=.2;else if(q.num||q.dust)q.vy*=.93;else if(!q.dove&&!q.plus&&!q.ring&&!q.spark&&!q.angel&&!q.light)q.vy+=.08;}
 parts=parts.filter(q=>q.life>0);foes=foes.filter(e=>!e.gone);
 for(const z of zones){if(z.done)continue;
  if(!z.active&&p.x>z.x+70&&p.x<z.x+W-20&&!(arena&&arena.started)){z.active=true;lock={l:z.x,r:z.x+W};showToast('BATTLE!',70);SFX.boom();nextWave(z);}
  else if(z.active&&!foes.some(e=>e.zone===z)){if(z.wave+1<level.L.waves.length)nextWave(z);else{z.done=true;lock=null;showToast('GO! >>>',80);SFX.gate();}}}
 if(arena&&!arena.started&&p.x>arena.x+90){arena.started=true;lock={l:arena.x,r:arena.x+W};p.vx=0;
  say(level.L.bossIntro,()=>{spawnBoss(level.L.boss);
   if(level.L.boss==='satan'){spawnAllies();say(BOSS_ALLY_LINES().concat([['n','Together, the friends stand against the enemy!'],['s','No... ALL of them?!']]),()=>state='play');}else state='play';});}
 let target=p.x+p.w/2-W/2+p.face*30;if(lock)target=lock.l;cam+=(target-cam)*(lock?.15:.1);cam=clamp(cam,0,level.w-W);
 if(p.y>H+30){p.hp-=20;SFX.hurt();combo.n=0;if(p.hp<=0){playerFell();p.x=lock?lock.l+40:p.cx;p.y=lock?40:p.cy-10;p.vx=p.vy=0;}else{p.x=lock?lock.l+40:p.cx;p.y=lock?40:p.cy-10;p.vx=p.vy=0;p.inv=90;p.pound=p.dive=false;p.dash=0;p.car=false;}}
 if(toast&&--toast.t<=0)toast=null;if(shake>0)shake--;
 if(combo.pop>0)combo.pop--;if(combo.t>0&&--combo.t<=0){if(combo.n>=8){const b=Math.floor(combo.n/4);stats.coins+=b;save.coins+=b;parts.push({num:'COMBO BONUS +'+b,coin:1,x:p.x+5,y:p.y-14,vy:-.5,life:80});SFX.coin();}combo.n=0;}
 if(own('rainbow')&&frame%2===0){trail.unshift({x:p.x+5,y:p.y+12});if(trail.length>16)trail.pop();}

/* ===================== LOOP ===================== */
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){acc-=1000/60;step();for(const k in Q)delete Q[k];}requestAnimationFrame(loop);}
let wasOn=false;
function step(){const on=isTouch&&state==='play';if(on!==wasOn){touchEl.classList.toggle('on',on);if(!on)releaseTouch();wasOn=on;}if(on)syncButtons();
 if(state!=='play')frame++;music();ctx.setTransform(VS,0,0,VS,0,0);
 switch(state){case'title':titleScreen();break;case'help':helpScreen();break;case'select':selectScreen();break;case'levels':levelScreen();break;case'dialog':dialogScreen();break;
  case'play':update();if(state!=='dialog')drawWorld();break;case'pause':pauseScreen();break;case'grace':graceScreen();break;case'celebrate':celebrate();break;case'results':resultsScreen();break;case'shop':shopScreen();break;}
 tap=null;}
requestAnimationFrame(loop);
})();
